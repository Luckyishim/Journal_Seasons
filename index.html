<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seasons Journal</title>
<style>
  :root{
    --bg: #f4f6f8;            /* Soft blue-tinted paper background */
    --card: #ffffff;          /* Pure white cards */
    --ink: #1e293b;           /* Deep slate blue for primary text */
    --sub: #64748b;           /* Muted dusty slate for subtitles */
    --line: #e2e8f0;          /* Subtle cool gray borders */
    --accent: #3b82f6;        /* Slate/royal blue highlight accent */
    --accent-soft: #eff6ff;   /* Very soft ice-blue tag pill background */
    --accent-border: #bfdbfe; /* Delicate blue border for pills */
    --danger: #ef4444;        /* Soft crimson for delete state */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:28px 20px 100px;
  }
  header{
    margin-bottom:24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  header h1{
    font-size:26px;
    font-weight:600;
    margin:0 0 4px;
    letter-spacing:-0.02em;
    color: var(--ink);
  }
  header p{
    margin:0;
    color:var(--sub);
    font-size:14px;
  }
  .sync-actions {
    display: flex;
    gap: 6px;
  }
  .sync-btn {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--sub);
    padding: 6px 10px;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s ease;
  }
  .sync-btn:hover {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent-border);
  }
  .season-list{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:20px;
  }
  .season-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
  }
  .season-info{
    min-width:0;
  }
  .season-number-tag {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .season-title{
    font-size:17px;
    font-weight:600;
    margin:0 0 6px;
    overflow-wrap:break-word;
    color: var(--ink);
  }
  .season-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .season-days{
    font-size:12px;
    display:inline-block;
    background:var(--accent-soft);
    color:var(--accent);
    border: 1px solid var(--accent-border);
    padding:2px 8px;
    border-radius:100px;
    font-weight:500;
  }
  .season-dates {
    font-size:12px;
    color:var(--sub);
  }
  .season-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .icon-btn{
    border:none;
    background:transparent;
    color:var(--sub);
    width:34px;
    height:34px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:16px;
    transition: all 0.15s ease;
  }
  .icon-btn:hover{
    background:var(--accent-soft);
    color:var(--accent);
  }
  .icon-btn.delete:hover{
    background:#fef2f2;
    color:var(--danger);
  }
  .empty{
    text-align:center;
    padding:48px 20px;
    color:var(--sub);
    border:1px dashed var(--line);
    border-radius:14px;
    background: var(--card);
  }
  .empty p{margin:0;font-size:14px;}
  .add-btn{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--accent);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .add-btn:hover{
    background: var(--accent-soft);
    border-color: var(--accent-border);
  }
  .add-btn:active{transform:scale(0.99);}

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(2px);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:10;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--card);
    width:100%;
    max-width:560px;
    border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.08);
  }
  @media (min-width:601px){
    .overlay{align-items:center;}
    .sheet{border-radius:16px; max-width:440px;}
  }
  .sheet h2{
    margin:0 0 16px;
    font-size:18px;
    font-weight:600;
    color: var(--ink);
  }
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:13px;
    color:var(--sub);
    margin-bottom:6px;
    font-weight:500;
  }
  .field input, .field textarea{
    width:100%;
    padding:12px 13px;
    border-radius:10px;
    border:1px solid var(--line);
    font-size:15px;
    background:#f8fafc;
    color:var(--ink);
  }
  .field input:focus, .field textarea:focus{
    outline:none;
    border-color:var(--accent);
    background: #ffffff;
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:1px solid var(--line);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    background:var(--card);
    color:var(--ink);
  }
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .error-text{
    color:var(--danger);
    font-size:12px;
    margin-top:5px;
    display:none;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Seasons Journal</h1>
      <p>The chapters of your life, one season at a time.</p>
    </div>
    <div class="sync-actions">
      <button class="sync-btn" id="exportBtn" title="Export data to move to mobile">Export</button>
      <button class="sync-btn" id="importBtn" title="Import data from laptop">Import</button>
    </div>
  </header>

  <div class="season-list" id="seasonList"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <p>No seasons yet. Add the first chapter of your story.</p>
  </div>

  <button class="add-btn" id="openAdd">+ Add a season</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheetContent">
    <h2 id="sheetTitle">Add a season</h2>
    <div id="formBody"></div>
    <div class="sheet-actions" id="sheetActions"></div>
  </div>
</div>

<script>
  let seasons = JSON.parse(localStorage.getItem('seasons_journal')) || [];
  let editingId = null;

  const listEl = document.getElementById('seasonList');
  const emptyEl = document.getElementById('emptyState');
  const overlay = document.getElementById('overlay');
  const sheetTitle = document.getElementById('sheetTitle');
  const formBody = document.getElementById('formBody');
  const sheetActions = document.getElementById('sheetActions');

  function saveToStorage() {
    localStorage.setItem('seasons_journal', JSON.stringify(seasons));
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const date = new Date(dateStr + 'T00:00:00');
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function render(){
    listEl.innerHTML = '';
    if(seasons.length === 0){
      emptyEl.style.display = 'block';
    } else {
      emptyEl.style.display = 'none';
      seasons.forEach((s, index) => {
        const card = document.createElement('div');
        card.className = 'season-card';
        
        let dateRangeText = '';
        if (s.startDate && s.endDate) {
          dateRangeText = `${formatDate(s.startDate)} – ${formatDate(s.endDate)}`;
        }

        card.innerHTML = `
          <div class="season-info">
            <div class="season-number-tag">Season ${index + 1}</div>
            <div class="season-title"></div>
            <div class="season-meta">
              <span class="season-days"></span>
              <span class="season-dates">${dateRangeText}</span>
            </div>
          </div>
          <div class="season-actions">
            <button class="icon-btn edit-btn" aria-label="Edit">✎</button>
            <button class="icon-btn delete delete-btn" aria-label="✕">✕</button>
          </div>
        `;
        
        card.querySelector('.season-title').textContent = s.title;
        card.querySelector('.season-days').textContent = 'Day ' + s.start + ' – Day ' + s.end + ' (' + s.days + (s.days === 1 ? ' day' : ' days') + ')';
        card.querySelector('.edit-btn').onclick = () => openEdit(s.id);
        card.querySelector('.delete-btn').onclick = () => deleteSeason(s.id);
        listEl.appendChild(card);
      });
    }
  }

  function renderForm(s = null) {
    const titleVal = s ? s.title : '';
    const startVal = s ? s.start : '';
    const endVal = s ? s.end : '';
    const startDateVal = s ? (s.startDate || '') : '';
    const endDateVal = s ? (s.endDate || '') : '';

    formBody.innerHTML = `
      <div class="field">
        <label for="titleInput">Season Title</label>
        <input type="text" id="titleInput" placeholder="e.g. Summer of Learning" value="${titleVal}" />
        <div class="error-text" id="titleError">Enter a title first.</div>
      </div>
      <div class="field" style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label for="startDateInput">Start Date</label>
          <input type="date" id="startDateInput" value="${startDateVal}" />
        </div>
        <div style="flex:1;">
          <label for="endDateInput">End Date</label>
          <input type="date" id="endDateInput" value="${endDateVal}" />
        </div>
      </div>
      <div class="field" style="display:flex; gap:10px;">
        <div style="flex:1;">
          <label for="startInput">From day</label>
          <input type="number" id="startInput" min="1" inputmode="numeric" value="${startVal}" placeholder="1" />
        </div>
        <div style="flex:1;">
          <label for="endInput">To day</label>
          <input type="number" id="endInput" min="1" inputmode="numeric" value="${endVal}" placeholder="30" />
        </div>
      </div>
      <div class="error-text" id="daysError">Enter a valid day range (end must be after start).</div>
      <div class="error-text" id="datesError">End date must be after start date.</div>
    `;

    sheetActions.style.display = 'flex';
    sheetActions.innerHTML = `
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save</button>
    `;

    document.getElementById('cancelBtn').onclick = closeSheet;
    document.getElementById('saveBtn').onclick = save;
  }

  function openAdd(){
    editingId = null;
    sheetTitle.textContent = `Add Season ${seasons.length + 1}`;
    renderForm();
    overlay.classList.add('open');
    setTimeout(() => document.getElementById('titleInput').focus(), 50);
  }

  function openEdit(id){
    const s = seasons.find(x => x.id === id);
    if(!s) return;
    editingId = id;
    const seasonIndex = seasons.findIndex(x => x.id === id) + 1;
    sheetTitle.textContent = `Edit Season ${seasonIndex}`;
    renderForm(s);
    overlay.classList.add('open');
  }

  function closeSheet(){
    overlay.classList.remove('open');
  }

  function save(){
    const tInput = document.getElementById('titleInput');
    const sInput = document.getElementById('startInput');
    const eInput = document.getElementById('endInput');
    const stDateInput = document.getElementById('startDateInput');
    const endDateInput = document.getElementById('endDateInput');

    const tError = document.getElementById('titleError');
    const dError = document.getElementById('daysError');
    const dtError = document.getElementById('datesError');

    const title = tInput.value.trim();
    const start = parseInt(sInput.value, 10);
    const end = parseInt(eInput.value, 10);
    const startDate = stDateInput.value;
    const endDate = endDateInput.value;

    let valid = true;

    if(!title){
      tError.style.display = 'block';
      valid = false;
    } else {
      tError.style.display = 'none';
    }

    if(isNaN(start) || isNaN(end) || start < 1 || end < start){
      dError.style.display = 'block';
      valid = false;
    } else {
      dError.style.display = 'none';
    }

    if(startDate && endDate && new Date(startDate) > new Date(endDate)) {
      dtError.style.display = 'block';
      valid = false;
    } else {
      dtError.style.display = 'none';
    }

    if(!valid) return;

    const days = end - start + 1;

    if(editingId){
      const s = seasons.find(x => x.id === editingId);
      s.title = title;
      s.start = start;
      s.end = end;
      s.days = days;
      s.startDate = startDate;
      s.endDate = endDate;
    } else {
      seasons.push({
        id: Date.now().toString(),
        title: title,
        start: start,
        end: end,
        days: days,
        startDate: startDate,
        endDate: endDate,
        entries: []
      });
    }

    saveToStorage();
    render();
    closeSheet();
  }

  function deleteSeason(id){
    seasons = seasons.filter(s => s.id !== id);
    saveToStorage();
    render();
  }

  document.getElementById('exportBtn').onclick = () => {
    const dataStr = JSON.stringify(seasons, null, 2);
    sheetTitle.textContent = 'Export Data';
    formBody.innerHTML = `
      <div class="field">
        <label>Copy this code to paste on your other device:</label>
        <textarea rows="6" readonly id="exportArea">${dataStr}</textarea>
      </div>
    `;
    sheetActions.style.display = 'block';
    sheetActions.innerHTML = `<button class="btn primary" style="width:100%" id="copyBtn">Copy to Clipboard</button>`;
    document.getElementById('copyBtn').onclick = () => {
      navigator.clipboard.writeText(dataStr);
      document.getElementById('copyBtn').textContent = 'Copied!';
    };
    overlay.classList.add('open');
  };

  document.getElementById('importBtn').onclick = () => {
    sheetTitle.textContent = 'Import Data';
    formBody.innerHTML = `
      <div class="field">
        <label>Paste your exported code here:</label>
        <textarea rows="6" id="importArea" placeholder="Paste JSON here..."></textarea>
      </div>
      <div class="error-text" id="importError">Invalid data format.</div>
    `;
    sheetActions.style.display = 'flex';
    sheetActions.innerHTML = `
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="confirmImport">Import</button>
    `;
    document.getElementById('cancelBtn').onclick = closeSheet;
    document.getElementById('confirmImport').onclick = () => {
      try {
        const parsed = JSON.parse(document.getElementById('importArea').value);
        if(Array.isArray(parsed)){
          seasons = parsed;
          saveToStorage();
          render();
          closeSheet();
        } else {
          throw new Error();
        }
      } catch(e) {
        document.getElementById('importError').style.display = 'block';
      }
    };
    overlay.classList.add('open');
  };

  document.getElementById('openAdd').onclick = openAdd;
  overlay.onclick = (e) => { if(e.target === overlay) closeSheet(); };

  render();
</script>
</body>
</html>
