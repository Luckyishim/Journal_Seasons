<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seasons Journal</title>
<style>
  :root{
    --bg:#faf8f5;
    --card:#ffffff;
    --ink:#2b2824;
    --sub:#8a8378;
    --line:#e9e4dc;
    --accent:#a8724f;
    --accent-soft:#f2e6dc;
    --danger:#b5544a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:28px 20px 100px;
  }
  header{
    margin-bottom:24px;
  }
  header h1{
    font-size:26px;
    font-weight:600;
    margin:0 0 4px;
    letter-spacing:-0.02em;
  }
  header p{
    margin:0;
    color:var(--sub);
    font-size:14px;
  }
  .season-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
  }
  .season-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .season-info{
    min-width:0;
  }
  .season-title{
    font-size:16px;
    font-weight:600;
    margin:0 0 4px;
    overflow-wrap:break-word;
  }
  .season-days{
    font-size:13px;
    color:var(--sub);
    display:inline-block;
    background:var(--accent-soft);
    color:var(--accent);
    padding:2px 9px;
    border-radius:100px;
    font-weight:500;
  }
  .season-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .icon-btn{
    border:none;
    background:transparent;
    color:var(--sub);
    width:34px;
    height:34px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:16px;
  }
  .icon-btn:hover{
    background:var(--accent-soft);
    color:var(--accent);
  }
  .icon-btn.delete:hover{
    background:#f6e5e2;
    color:var(--danger);
  }
  .empty{
    text-align:center;
    padding:48px 20px;
    color:var(--sub);
    border:1px dashed var(--line);
    border-radius:14px;
  }
  .empty p{margin:0;font-size:14px;}
  .add-btn{
    width:100%;
    padding:14px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--accent);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .add-btn:active{transform:scale(0.99);}

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(30,25,20,0.35);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:10;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--card);
    width:100%;
    max-width:560px;
    border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  }
  @media (min-width:601px){
    .overlay{align-items:center;}
    .sheet{border-radius:16px; max-width:420px;}
  }
  .sheet h2{
    margin:0 0 16px;
    font-size:18px;
    font-weight:600;
  }
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:13px;
    color:var(--sub);
    margin-bottom:6px;
    font-weight:500;
  }
  .field input{
    width:100%;
    padding:12px 13px;
    border-radius:10px;
    border:1px solid var(--line);
    font-size:15px;
    background:#fdfcfb;
    color:var(--ink);
  }
  .field input:focus{
    outline:none;
    border-color:var(--accent);
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:1px solid var(--line);
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    background:var(--card);
    color:var(--ink);
  }
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .error-text{
    color:var(--danger);
    font-size:12px;
    margin-top:5px;
    display:none;
  }
  .error-text.show{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Seasons journal</h1>
    <p>The chapters of your life, one season at a time.</p>
  </header>

  <div class="season-list" id="seasonList"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <p>No seasons yet. Add the first chapter of your story.</p>
  </div>

  <button class="add-btn" id="openAdd">+ Add a season</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">Add a season</h2>
    <div class="field">
      <label for="titleInput">Title</label>
      <input type="text" id="titleInput" />
      <div class="error-text" id="titleError">Enter a title first.</div>
    </div>
    <div class="field" style="display:flex; gap:10px;">
      <div style="flex:1;">
        <label for="startInput">From day</label>
        <input type="number" id="startInput"  min="1" inputmode="numeric" />
      </div>
      <div style="flex:1;">
        <label for="endInput">To day</label>
        <input type="number" id="endInput"  min="1" inputmode="numeric" />
      </div>
    </div>
    <div class="error-text" id="daysError">Enter a valid day range (end must be after start).</div>
    <div class="sheet-actions">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script>
  let seasons = [];
  let editingId = null;

  const listEl = document.getElementById('seasonList');
  const emptyEl = document.getElementById('emptyState');
  const overlay = document.getElementById('overlay');
  const titleInput = document.getElementById('titleInput');
  const startInput = document.getElementById('startInput');
  const endInput = document.getElementById('endInput');
  const sheetTitle = document.getElementById('sheetTitle');
  const titleError = document.getElementById('titleError');
  const daysError = document.getElementById('daysError');

  function render(){
    listEl.innerHTML = '';
    if(seasons.length === 0){
      emptyEl.style.display = 'block';
    } else {
      emptyEl.style.display = 'none';
      seasons.forEach(s => {
        const card = document.createElement('div');
        card.className = 'season-card';
        card.innerHTML = `
          <div class="season-info">
            <p class="season-title"></p>
            <span class="season-days"></span>
          </div>
          <div class="season-actions">
            <button class="icon-btn edit-btn" aria-label="Edit">✎</button>
            <button class="icon-btn delete delete-btn" aria-label="Delete">✕</button>
          </div>
        `;
        card.querySelector('.season-title').textContent = s.title;
        card.querySelector('.season-days').textContent = 'Day ' + s.start + ' – Day ' + s.end + ' · ' + s.days + (s.days === 1 ? ' day' : ' days');
        card.querySelector('.edit-btn').onclick = () => openEdit(s.id);
        card.querySelector('.delete-btn').onclick = () => deleteSeason(s.id);
        listEl.appendChild(card);
      });
    }
  }

  function openAdd(){
    editingId = null;
    sheetTitle.textContent = 'Add a season';
    titleInput.value = '';
    startInput.value = '';
    endInput.value = '';
    clearErrors();
    overlay.classList.add('open');
    setTimeout(() => titleInput.focus(), 50);
  }

  function openEdit(id){
    const s = seasons.find(x => x.id === id);
    if(!s) return;
    editingId = id;
    sheetTitle.textContent = 'Edit season';
    titleInput.value = s.title;
    startInput.value = s.start;
    endInput.value = s.end;
    clearErrors();
    overlay.classList.add('open');
  }

  function closeSheet(){
    overlay.classList.remove('open');
  }

  function clearErrors(){
    titleError.classList.remove('show');
    daysError.classList.remove('show');
  }

  function save(){
    const title = titleInput.value.trim();
    const start = parseInt(startInput.value, 10);
    const end = parseInt(endInput.value, 10);
    let valid = true;

    if(!title){
      titleError.classList.add('show');
      valid = false;
    } else {
      titleError.classList.remove('show');
    }

    if(isNaN(start) || isNaN(end) || start < 1 || end < start){
      daysError.classList.add('show');
      valid = false;
    } else {
      daysError.classList.remove('show');
    }

    if(!valid) return;

    const days = end - start + 1;

    if(editingId){
      const s = seasons.find(x => x.id === editingId);
      s.title = title;
      s.start = start;
      s.end = end;
      s.days = days;
    } else {
      seasons.push({
        id: Date.now().toString(),
        title: title,
        start: start,
        end: end,
        days: days,
        entries: [] // reserved for future daily journal entries
      });
    }

    render();
    closeSheet();
  }

  function deleteSeason(id){
    seasons = seasons.filter(s => s.id !== id);
    render();
  }

  document.getElementById('openAdd').onclick = openAdd;
  document.getElementById('cancelBtn').onclick = closeSheet;
  document.getElementById('saveBtn').onclick = save;
  overlay.onclick = (e) => { if(e.target === overlay) closeSheet(); };
  titleInput.addEventListener('input', () => titleError.classList.remove('show'));
  startInput.addEventListener('input', () => daysError.classList.remove('show'));
  endInput.addEventListener('input', () => daysError.classList.remove('show'));

  render();
</script>
</body>
</html>
